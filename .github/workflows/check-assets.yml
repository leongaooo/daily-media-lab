name: Check assets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Validate every tracked JSON file
        run: |
          set -euo pipefail
          while read -r f; do
            echo "checking $f"
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"
          done < <(git ls-files '*.json')
      - name: Test media storage governance
        run: python -m unittest discover -s skills/news-to-video/scripts -p 'test_*storage.py'
