name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install render-side dependencies
        run: python -m pip install -r skills/news-to-video/assets/requirements.txt

      - name: Run media contract tests
        run: python -m unittest discover -s skills/news-to-video/scripts -p 'test_*.py'

      - name: Run OPS-01 pure utility tests
        run: python -m unittest discover -s ops -p 'test_*.py'
